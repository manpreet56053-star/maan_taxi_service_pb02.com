<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maan Taxi Service | Premium Travel</title>

<meta name="description"
content="Maan Taxi Service - Premium, safe and reliable taxi service for local, outstation and airport travel.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f7f5ef;
    color:#183b35;
    line-height:1.6;
}

/* ===== COLORS ===== */

:root{
    --green:#073b35;
    --green2:#0b5148;
    --gold:#d7a928;
    --gold2:#f1c75b;
    --cream:#f7f5ef;
    --white:#ffffff;
    --text:#173d37;
    --muted:#6c7774;
}

/* ===== HEADER ===== */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(7,59,53,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.1);
}

.navbar{
    max-width:1150px;
    margin:auto;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    text-decoration:none;
    font-size:24px;
    font-weight:800;
}

.logo span{
    color:var(--gold2);
}

.nav-links{
    display:flex;
    gap:28px;
    list-style:none;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:.3s;
}

.nav-links a:hover{
    color:var(--gold2);
}

.nav-btn{
    background:var(--gold);
    color:#142b27 !important;
    padding:11px 20px;
    border-radius:30px;
}

/* ===== HERO ===== */

.hero{
    min-height:100vh;
    padding:150px 25px 80px;
    background:
    radial-gradient(circle at 80% 20%,rgba(215,169,40,.18),transparent 30%),
    linear-gradient(135deg,#062f2a,#0a5148);
    color:white;
    display:flex;
    align-items:center;
}

.hero-container{
    max-width:1150px;
    width:100%;
    margin:auto;
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:70px;
    align-items:center;
}

.badge{
    display:inline-block;
    color:var(--gold2);
    border:1px solid rgba(241,199,91,.5);
    padding:8px 16px;
    border-radius:30px;
    font-size:13px;
    font-weight:bold;
    letter-spacing:1px;
    margin-bottom:22px;
}

.hero h1{
    font-size:64px;
    line-height:1.05;
    margin-bottom:25px;
    letter-spacing:-2px;
}

.hero h1 span{
    color:var(--gold2);
}

.hero p{
    font-size:19px;
    color:#d9e4e1;
    max-width:600px;
    margin-bottom:35px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    text-decoration:none;
    padding:15px 28px;
    border-radius:40px;
    font-weight:700;
    transition:.3s;
}

.btn-gold{
    background:var(--gold2);
    color:#17332e;
}

.btn-gold:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(241,199,91,.25);
}

.btn-outline{
    color:white;
    border:1px solid rgba(255,255,255,.35);
}

.btn-outline:hover{
    border-color:var(--gold2);
    color:var(--gold2);
}

/* ===== PREMIUM CARD ===== */

.luxury-card{
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.18);
    border-radius:28px;
    padding:35px;
    backdrop-filter:blur(15px);
    box-shadow:0 25px 60px rgba(0,0,0,.22);
}

.car-icon{
